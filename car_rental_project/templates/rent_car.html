{% extends "base.html" %}

{% block content %}
<h2>Rent Car: {{ car.brand }} {{ car.model }}</h2>
<p>Daily Rate: <strong>${{ "{:.2f}".format(car.rate) }}</strong></p>

{% if error %}
    <p class="error">Error: {{ error }}</p>
{% endif %}

<form method="POST">
    <div class="form-group">
        <label for="customer_id">Customer ID:</label>
        <input type="number" id="customer_id" name="customer_id" required>
    </div>
    <div class="form-group">
        <label for="staff_id">Staff ID (Processing):</label>
        <input type="number" id="staff_id" name="staff_id" required>
    </div>
    <div class="form-group">
        <label for="rental_date">Rental Date:</label>
        <input type="date" id="rental_date" name="rental_date" required>
    </div>
    <div class="form-group">
        <label for="return_date">Planned Return Date:</label>
        <input type="date" id="return_date" name="return_date" required>
    </div>
    <button type="submit" class="btn">Confirm Rental</button>
    <a href="{{ url_for('index') }}" style="margin-left: 10px;">Cancel</a>
</form>
{% endblock %}
